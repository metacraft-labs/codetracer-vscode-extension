scenario: 1
name: value-origin/python-frame-transitions
pack: codetracer
summary: >-
  A value passed as an argument: its Origin Chain crosses the call and marks
  the hop that does.

stage:
  - use: record-program
    with: { program: src/db-backend/tests/fixtures/origin/python/parameter_pass/main.py }
  - use: open-recording
    with: { panes: variables }

steps:
  - beat: stop
    steps:
      - wait: { until: replay-idle, timeout: 180s }
      - wait: { until: { at: 'editor[file="main.py"]/line[number="9"]', present: true }, timeout: 60s }
      - click: { at: 'editor[file="main.py"]/line[number="9"]', anchor: text-start }
      - key: F9
      - expect: { at: 'editor[file="main.py"]/line[number="9"]', breakpoint: true }
      - key: F5
        settle: false
      - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(9)" }, timeout: 120s }
      - wait: { until: replay-idle, timeout: 60s }
  - beat: ask
    narration: { text: "Where did `local` come from? Select it and ask for its origin." }
    steps:
      - click: { at: 'editor[file="main.py"]/line[number="9"]', anchor: "column(11)", count: 2 }
      - chord: { bound: variables.show-value-origin }
        settle: false
      - wait: { until: origin-chain.loaded, timeout: 120s }
      - expect: { at: origin-chain, assert: "has-frame-transition" }
