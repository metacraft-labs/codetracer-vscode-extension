scenario: 1
name: value-origin/python-computational
pack: codetracer
summary: >-
  The origin of `result = a + b` is a Computational hop; opening the hop shows
  the snapshots of its operands.

stage:
  - use: record-program
    with: { program: src/db-backend/tests/fixtures/origin/python/computational_origin/main.py }
  - use: open-recording
    with: { panes: variables }

steps:
  - beat: stop
    steps:
      - wait: { until: replay-idle, timeout: 180s }
      - wait: { until: { at: 'editor[file="main.py"]/line[number="10"]', present: true }, timeout: 60s }
      - click: { at: 'editor[file="main.py"]/line[number="10"]', anchor: text-start }
      - key: F9
      - expect: { at: 'editor[file="main.py"]/line[number="10"]', breakpoint: true }
      - key: F5
        settle: false
      - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(10)" }, timeout: 120s }
      - wait: { until: replay-idle, timeout: 60s }
  - beat: ask
    narration: { text: "Where did `result` come from? Select it and ask for its origin." }
    steps:
      - click: { at: 'editor[file="main.py"]/line[number="10"]', anchor: "column(11)", count: 2 }
      - chord: { bound: variables.show-value-origin }
        settle: false
      - wait: { until: origin-chain.loaded, timeout: 120s }
      - expect: { at: origin-chain, assert: "has-hop(Computational)" }
      - expect: { at: 'origin-chain/origin-hop[number="1"]', classification: Computational, operands: 0 }
  - beat: operands
    steps:
      - click: { at: 'origin-chain/origin-hop[number="1"]', anchor: expander }
      - expect: { at: 'origin-chain/origin-hop[number="1"]', operands: { ge: 2 } }
