name: CI

# `dev` is the default branch and the base of every recent PR; `main` is
# retained because it still exists. The previous `[main]`-only filters meant
# neither pushes to `dev` nor PRs based on it ran any CI.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    # Runs on the NixOS eph-linux-x64 class using the repo's nix dev env, the
    # same way wdio-smoke/wdio-integration below do. node + just come from the
    # flake via dev-exec — the old actions/setup-node + extractions/setup-just
    # steps downloaded FHS-dynamically-linked binaries that do not run on NixOS.
    runs-on: eph-linux-x64

    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: Install dependencies
        run: dev-exec just install

      - name: Lint
        run: dev-exec just lint

      - name: Compile TypeScript
        run: dev-exec just compile-ts

      - name: Typecheck WDIO tests
        run: dev-exec just compile-wdio

  windows-build:
    # CIP-5: windows-latest → the Windows runner class (DIY setup-node/setup-just
    # is Windows-native here).
    #
    # Single label, not an array. The previous form assumed the extra label
    # would just "queue until that class is live" — it does not: `runs-on:
    # [a, b]` is an AND over labels, demanding ONE runner carrying BOTH, so
    # adding eph-win-arm64 did not add a fallback, it made the job unschedulable
    # on eph-win-x64 too. The two classes are separate pools on separate hosts.
    # To span both, use a matrix axis (`matrix: runs-on: [...]` +
    # `runs-on: ${{ matrix.runs-on }}`).
    runs-on: eph-win-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Lint
        run: just lint

      - name: Compile TypeScript
        run: npm run compile:ts

      - name: Typecheck WDIO tests
        run: npm run compile:wdio

      - name: Verify compiled output exists
        run: if not exist out\extension.js exit 1
        shell: cmd

  wdio-smoke:
    runs-on: eph-linux-x64  # CIP-5: nix job (setup-dev-env) → eph-linux-x64

    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v4

      # setup-dev-env installs Nix, materialises this repo's nix dev env,
      # and installs the `dev-exec` wrapper (replacing the open-coded
      # setup-nix step). This job needs no cross-repo siblings.
      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: Install dependencies
        run: dev-exec just install

      - name: Compile TypeScript
        run: dev-exec just compile-ts

      - name: Typecheck WDIO tests
        run: dev-exec just compile-wdio

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
            echo "Restored Nim-compiled ct_vscode.js to out/"
          else
            echo "WARNING: media/ct_vscode.js not found — Nim backend will not be available"
          fi

      - name: Run WDIO smoke tests
        run: dev-exec just test-wdio-smoke

      - name: Run VS Code extension host tests
        run: dev-exec just test-vscode

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-diagnostics
          path: test/wdio/diagnostics/
          retention-days: 7

  # Per-language smoke tests — requires sibling repos for trace recording.
  # Runs on self-hosted NixOS runners with workspace sibling restoration.
  # Runs by default; add the 'skip-integration' label to a PR to skip.
  wdio-integration:
    runs-on: eph-linux-x64  # CIP-5: nix job (setup-dev-env) → eph-linux-x64
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-integration')

    # CI runners typically lack hardware performance counters, so use rr's
    # software counter mode (-W flag) for recording and replaying native
    # language traces (Rust, C, Go, Nim).
    env:
      CODETRACER_RR_SOFT_MODE: "1"

    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v4

      # setup-dev-env installs Nix, materialises this repo's nix dev env,
      # installs the `dev-exec` wrapper, and clones the cross-repo siblings
      # this job needs at workspace-lock-pinned revisions (replacing the
      # former setup-nix + manifest/resolve/clone steps). codetracer and the
      # lock-managed recorder/backend siblings resolve from the workspace lock.
      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          siblings: |
            codetracer
            codetracer-native-backend
            codetracer-ruby-recorder
            codetracer-python-recorder

      - name: Build codetracer (ct + db-backend binaries)
        run: |
          cd ../codetracer
          FLAKE_OVERRIDE="--override-input codetracer-trace-format path:./libs/codetracer-trace-format"
          nix build -L ".?submodules=1#codetracer" $FLAKE_OVERRIDE
          nix build -L ".?submodules=1#db-backend" $FLAKE_OVERRIDE -o result-db-backend

      # Build recorder components that ct needs to record traces for each
      # language family.  These are separate repos (restored as siblings above)
      # with their own flake.nix.  The built binaries are symlinked into
      # COMBINED_BIN below so ct can discover them via PATH.
      - name: Build ct-native-replay (native language recording)
        run: |
          if [ -d ../codetracer-native-backend ]; then
            cd ../codetracer-native-backend
            nix build -L ".?submodules=1#ct-native-replay" -o result-native-replay
          elif [ -d ../codetracer-rr-backend ]; then
            cd ../codetracer-rr-backend
            nix build -L ".?submodules=1#codetracer-rr-support" -o result-rr-support
          else
            echo "WARNING: codetracer-native-backend not found — native language recording will fail"
          fi

      - name: Build codetracer-ruby-recorder
        run: |
          if [ -d ../codetracer-ruby-recorder ]; then
            cd ../codetracer-ruby-recorder
            nix build -L ".#codetracer-ruby-recorder" -o result-ruby-recorder
          else
            echo "WARNING: codetracer-ruby-recorder not found — Ruby recording will fail"
          fi

      # The Python recorder is a Rust-backed Python module (PyO3/maturin).
      # We pip-install it into a venv using the recorder repo's own dev shell
      # (which provides the Rust toolchain, capnproto, and Python needed to
      # compile the native extension).  The default dev shell has multiple
      # Python versions; the package requires >=3.12, so we use python3.12.
      - name: Set up Python recorder
        run: |
          if [ -d ../codetracer-python-recorder/codetracer-python-recorder ]; then
            VENV_DIR="$(pwd)/.python-recorder-venv"
            cd ../codetracer-python-recorder
            nix develop . --accept-flake-config -c bash -c '
              python3.12 -m venv "'"$VENV_DIR"'"
              "'"$VENV_DIR"'/bin/pip" install --quiet \
                ./codetracer-python-recorder 2>&1 | tail -5
            '
            if "$VENV_DIR/bin/python" -c "import codetracer_python_recorder" 2>/dev/null; then
              echo "Python recorder installed successfully."
            else
              echo "WARNING: Failed to install codetracer_python_recorder."
            fi
          else
            echo "WARNING: codetracer-python-recorder not found — Python recording will fail"
          fi

      - name: Install dependencies
        run: dev-exec just install

      - name: Compile TypeScript
        run: dev-exec just compile-ts

      - name: Typecheck WDIO tests
        run: dev-exec just compile-wdio

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
          fi

      # The extension resolves db-backend from dirname(runnablePath). The nix
      # packages for ct and db-backend are separate outputs, so we create a
      # combined bin/ directory with symlinks to both. The .vscode/ directory
      # is gitignored, so settings.json must be generated in CI.
      - name: Configure ct binary path for WDIO tests
        run: |
          COMBINED_BIN="$(pwd)/.ct-bin"
          mkdir -p "$COMBINED_BIN"
          # Symlink ct from the codetracer package.
          # Try multiple locations: nix build result, then build-debug.
          CT_SRC=""
          for candidate in \
            ../codetracer/result/bin/ct \
            ../codetracer/src/build-debug/bin/ct; do
            resolved="$(realpath "$candidate" 2>/dev/null || true)"
            if [ -x "$resolved" ]; then
              CT_SRC="$resolved"
              break
            fi
          done
          if [ -n "$CT_SRC" ]; then
            ln -sf "$CT_SRC" "$COMBINED_BIN/ct"
            echo "ct binary: $CT_SRC"
          else
            echo "WARNING: ct binary not found in ../codetracer/result/bin/ or ../codetracer/src/build-debug/bin/"
          fi
          # Symlink db-backend from the db-backend package.
          DB_SRC="$(realpath ../codetracer/result-db-backend/bin/db-backend 2>/dev/null || true)"
          if [ -x "$DB_SRC" ]; then
            ln -sf "$DB_SRC" "$COMBINED_BIN/db-backend"
          else
            echo "WARNING: db-backend not found in ../codetracer/result-db-backend/bin/"
          fi
          # Symlink ct-native-replay for native language recording (Rust, C, Go, Nim).
          RR_SRC="$(realpath ../codetracer-native-backend/result-native-replay/bin/ct-native-replay 2>/dev/null \
                    || realpath ../codetracer-rr-backend/result-rr-support/bin/ct-rr-support 2>/dev/null || true)"
          if [ -x "$RR_SRC" ]; then
            ln -sf "$RR_SRC" "$COMBINED_BIN/ct-native-replay"
            echo "ct-native-replay: $RR_SRC"
          else
            echo "WARNING: ct-native-replay not found — native language recording will fail"
          fi
          # rr is resolved later in the "Record test traces" step (which
          # enters the rr-backend dev shell) and symlinked into COMBINED_BIN.
          # Symlink codetracer-ruby-recorder for Ruby recording.
          RUBY_REC_SRC="$(realpath ../codetracer-ruby-recorder/result-ruby-recorder/bin/codetracer-ruby-recorder 2>/dev/null || true)"
          if [ -x "$RUBY_REC_SRC" ]; then
            ln -sf "$RUBY_REC_SRC" "$COMBINED_BIN/codetracer-ruby-recorder"
            echo "codetracer-ruby-recorder: $RUBY_REC_SRC"
          else
            echo "WARNING: codetracer-ruby-recorder not found — Ruby recording will fail"
          fi
          echo "Combined bin directory:"
          ls -la "$COMBINED_BIN"
          # Write workspace settings pointing at ct and ct-native-replay.
          # - runnablePath: ct binary for db-based traces (Python, Ruby, blockchain)
          # - rrWorkerPath: ct-native-replay binary for rr-based traces (Rust, C, Go, Nim)
          # rrExePath is omitted — the extension falls back to a sibling "rr"
          # next to ct-native-replay, or PATH lookup. Both work since COMBINED_BIN
          # contains rr and is on PATH.
          mkdir -p test/wdio/projects/stylus-test/.vscode
          printf '{\n  "codetracer.runnablePath": "%s/ct",\n  "codetracer.rrWorkerPath": "%s/ct-native-replay"\n}\n' \
            "$COMBINED_BIN" "$COMBINED_BIN" \
            > test/wdio/projects/stylus-test/.vscode/settings.json
          cat test/wdio/projects/stylus-test/.vscode/settings.json
          # Also add to PATH for the extension's findInPath fallback.
          echo "$COMBINED_BIN" >> "$GITHUB_PATH"
          # Set Python recorder interpreter for Python recording.
          if [ -x "$(pwd)/.python-recorder-venv/bin/python" ]; then
            echo "CODETRACER_PYTHON_INTERPRETER=$(pwd)/.python-recorder-venv/bin/python" >> "$GITHUB_ENV"
          fi

      # Record test traces for standard languages (Python, Ruby, Rust, C, Go, Nim).
      # This step runs inside the native-backend dev shell because:
      #   - ct record → ct-native-replay build needs compilers (gcc, rustc, go, nim)
      #   - ct record → ct-native-replay record needs rr for native language replay
      # The extension's own dev shell only has Node.js/VS Code tooling.
      - name: Record test traces
        run: |
          cd ../codetracer-native-backend
          nix develop ".?submodules=1" --accept-flake-config -c bash -c "
            cd '$GITHUB_WORKSPACE'
            just record-test-traces
          "

      # Symlink rr, dlv, and gdb into COMBINED_BIN so ct-native-replay can
      # find them at replay time. The native-backend dev shell's shellHook
      # creates symlinks at target/debug/{rr,dlv,gdb}. These were
      # created during the "Record test traces" step's `nix develop`.
      - name: Symlink replay tools (rr, dlv, gdb)
        run: |
          COMBINED_BIN="$GITHUB_WORKSPACE/.ct-bin"
          RR_BACKEND="../codetracer-native-backend"
          # rr is required — fail if missing.
          RR_PATH="$(realpath "$RR_BACKEND/target/debug/rr" 2>/dev/null || true)"
          echo "native-backend target/debug/rr resolves to: '$RR_PATH'"
          if [ -n "$RR_PATH" ] && [ -x "$RR_PATH" ]; then
            ln -sf "$RR_PATH" "$COMBINED_BIN/rr"
            echo "rr symlinked: $RR_PATH → $COMBINED_BIN/rr"
          else
            echo "ERROR: rr not found at $RR_BACKEND/target/debug/rr"
            echo "Listing target/debug/:"
            ls -la "$RR_BACKEND/target/debug/" 2>/dev/null || echo "  (directory does not exist)"
            exit 1
          fi
          # dlv (Delve) is needed for Go trace replay.
          DLV_PATH="$(realpath "$RR_BACKEND/target/debug/dlv" 2>/dev/null || true)"
          if [ -n "$DLV_PATH" ] && [ -x "$DLV_PATH" ]; then
            ln -sf "$DLV_PATH" "$COMBINED_BIN/dlv"
            echo "dlv symlinked: $DLV_PATH → $COMBINED_BIN/dlv"
          else
            echo "WARNING: dlv not found at $RR_BACKEND/target/debug/dlv — Go replay may fail"
          fi
          # gdb is needed for some native language debugging.
          GDB_PATH="$(realpath "$RR_BACKEND/target/debug/gdb" 2>/dev/null || true)"
          if [ -n "$GDB_PATH" ] && [ -x "$GDB_PATH" ]; then
            ln -sf "$GDB_PATH" "$COMBINED_BIN/gdb"
            echo "gdb symlinked: $GDB_PATH → $COMBINED_BIN/gdb"
          else
            echo "WARNING: gdb not found at $RR_BACKEND/target/debug/gdb"
          fi
          echo "COMBINED_BIN contents:"
          ls -la "$COMBINED_BIN"

      - name: Prepare blockchain trace fixtures
        run: dev-exec just prepare-wdio-blockchain-fixtures

      - name: Verify value-origin fixture prerequisites
        run: dev-exec just prepare-wdio-value-origin-fixtures

      - name: Run per-language smoke tests
        run: dev-exec just test-wdio-smoke-langs

      - name: Run deep integration tests
        run: dev-exec just test-wdio-deep

      - name: Run value-origin integration tests
        run: dev-exec just test-wdio-value-origin

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-integration-diagnostics
          path: test/wdio/diagnostics/
          retention-days: 7
