name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Lint
        run: just lint

      - name: Compile TypeScript
        run: just compile-ts

  windows-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Lint
        run: just lint

      - name: Compile TypeScript
        run: npm run compile:ts

      - name: Verify compiled output exists
        run: if not exist out\extension.js exit 1
        shell: cmd

  wdio-smoke:
    runs-on: [self-hosted, nixos]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          gh-token: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}

      - name: Install dependencies
        run: nix develop -c just install

      - name: Compile TypeScript
        run: nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
            echo "Restored Nim-compiled ct_vscode.js to out/"
          else
            echo "WARNING: media/ct_vscode.js not found — Nim backend will not be available"
          fi

      - name: Run WDIO smoke tests
        run: nix develop -c just test-wdio-smoke

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-diagnostics
          path: test/wdio/diagnostics/
          retention-days: 7

  # Per-language smoke tests — requires sibling repos for trace recording.
  # Runs on self-hosted NixOS runners with workspace sibling restoration.
  wdio-integration:
    runs-on: [self-hosted, nixos]
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-integration')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          gh-token: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Restore sibling repos
        env:
          GH_TOKEN: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
        run: |
          # Clone required sibling repos for trace recording
          cd ..
          for repo in codetracer codetracer-python-recorder codetracer-ruby-recorder; do
            if [ ! -d "$repo" ]; then
              git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/${repo}.git"
            fi
          done

      - name: Build codetracer (for ct binary)
        run: |
          cd ../codetracer
          nix build -L

      - name: Install dependencies
        run: nix develop -c just install

      - name: Compile TypeScript
        run: nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
          fi

      - name: Record test traces
        run: nix develop -c just record-test-traces

      - name: Run per-language smoke tests
        run: nix develop -c just test-wdio-smoke-langs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-integration-diagnostics
          path: test/wdio/diagnostics/
          retention-days: 7
