name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Lint
        run: just lint

      - name: Compile TypeScript
        run: just compile-ts

  windows-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Lint
        run: just lint

      - name: Compile TypeScript
        run: npm run compile:ts

      - name: Verify compiled output exists
        run: if not exist out\extension.js exit 1
        shell: cmd

  wdio-smoke:
    runs-on: [self-hosted, nixos]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          gh-token: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}

      - name: Install dependencies
        run: nix develop -c just install

      - name: Compile TypeScript
        run: nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
            echo "Restored Nim-compiled ct_vscode.js to out/"
          else
            echo "WARNING: media/ct_vscode.js not found — Nim backend will not be available"
          fi

      - name: Run WDIO smoke tests
        run: nix develop -c just test-wdio-smoke

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-diagnostics
          path: test/wdio/diagnostics/
          retention-days: 7

  # Per-language smoke tests — requires sibling repos for trace recording.
  # Runs on self-hosted NixOS runners with workspace sibling restoration.
  # Runs by default; add the 'skip-integration' label to a PR to skip.
  wdio-integration:
    runs-on: [self-hosted, nixos]
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-integration')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          gh-token: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}

      - name: Install just
        uses: extractions/setup-just@v2

      # Resolve the codetracer ref from sibling-pins (or fall back to main).
      - name: Resolve codetracer ref
        id: resolve-codetracer-ref
        run: |
          if [ -f .github/sibling-pins ]; then
            REF="$(grep '^codetracer ' .github/sibling-pins | cut -d' ' -f2)" || true
          fi
          echo "ref=${REF:-main}" >> "$GITHUB_OUTPUT"

      # Clone codetracer with submodules. Uses git clone directly (rather
      # than clone-repo action) because --recurse-submodules propagates
      # credentials to all submodules including private ones like
      # tree-sitter-nim.
      - name: Clone codetracer
        env:
          GH_TOKEN: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
        run: |
          CT_REF="${{ steps.resolve-codetracer-ref.outputs.ref }}"
          DEST="$GITHUB_WORKSPACE/../codetracer"
          rm -rf "$DEST"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/codetracer.git" \
            "$DEST"
          if [ "$CT_REF" != "main" ]; then
            git -C "$DEST" fetch origin "$CT_REF"
            git -C "$DEST" checkout "$CT_REF"
          fi

      # Clone remaining sibling repos from .github/sibling-pins.
      # Each line in the pins file is: <name> <sha> <branch>
      - name: Restore sibling repos
        env:
          GH_TOKEN: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
        run: |
          while read -r name sha branch; do
            [ -z "$name" ] && continue
            # codetracer is handled by the clone-repo action above
            [ "$name" = "codetracer" ] && continue
            dest="${GITHUB_WORKSPACE}/../${name}"
            if [ -d "$dest" ]; then
              echo "[$name] Already exists, skipping"
              continue
            fi
            echo "[$name] Cloning at $sha (branch: $branch)"
            git clone --depth 1 --branch "$branch" --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/${name}.git" \
              "$dest" || {
                echo "[$name] Shallow clone failed, trying full clone"
                rm -rf "$dest"
                git clone --no-checkout \
                  "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/${name}.git" \
                  "$dest"
                git -C "$dest" checkout "$sha"
              }
          done < .github/sibling-pins

      - name: Build codetracer (ct + db-backend binaries)
        run: |
          cd ../codetracer
          FLAKE_OVERRIDE="--override-input codetracer-trace-format path:./libs/codetracer-trace-format"
          nix build -L ".?submodules=1#codetracer" $FLAKE_OVERRIDE
          nix build -L ".?submodules=1#db-backend" $FLAKE_OVERRIDE -o result-db-backend

      - name: Install dependencies
        run: nix develop -c just install

      - name: Compile TypeScript
        run: nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
          fi

      # The extension resolves db-backend from dirname(runnablePath). The nix
      # packages for ct and db-backend are separate outputs, so we create a
      # combined bin/ directory with symlinks to both. The .vscode/ directory
      # is gitignored, so settings.json must be generated in CI.
      - name: Configure ct binary path for WDIO tests
        run: |
          COMBINED_BIN="$(pwd)/.ct-bin"
          mkdir -p "$COMBINED_BIN"
          # Symlink ct from the codetracer package.
          CT_SRC="$(realpath ../codetracer/result/bin/ct 2>/dev/null || true)"
          if [ -x "$CT_SRC" ]; then
            ln -sf "$CT_SRC" "$COMBINED_BIN/ct"
          else
            echo "WARNING: ct binary not found in ../codetracer/result/bin/"
          fi
          # Symlink db-backend from the db-backend package.
          DB_SRC="$(realpath ../codetracer/result-db-backend/bin/db-backend 2>/dev/null || true)"
          if [ -x "$DB_SRC" ]; then
            ln -sf "$DB_SRC" "$COMBINED_BIN/db-backend"
          else
            echo "WARNING: db-backend not found in ../codetracer/result-db-backend/bin/"
          fi
          echo "Combined bin directory:"
          ls -la "$COMBINED_BIN"
          # Write workspace settings pointing at ct in the combined directory.
          mkdir -p test/wdio/projects/stylus-test/.vscode
          printf '{\n  "codetracer.runnablePath": "%s/ct"\n}\n' "$COMBINED_BIN" \
            > test/wdio/projects/stylus-test/.vscode/settings.json
          cat test/wdio/projects/stylus-test/.vscode/settings.json
          # Also add to PATH for the extension's findInPath fallback.
          echo "$COMBINED_BIN" >> "$GITHUB_PATH"

      - name: Record test traces
        run: nix develop -c just record-test-traces

      - name: Prepare blockchain trace fixtures
        run: |
          # Run each fixture preparation script. These are idempotent and skip
          # if the fixture already exists (unless FORCE=1 is set).
          for script in \
            scripts/prepare-masm-fixture.sh \
            scripts/prepare-sway-fixture.sh \
            scripts/prepare-move-fixture.sh \
            scripts/prepare-solana-fixture.sh \
            scripts/prepare-aiken-fixture.sh \
            scripts/prepare-cadence-fixture.sh \
            scripts/prepare-cairo-fixture.sh \
            scripts/prepare-circom-fixture.sh \
            scripts/prepare-leo-fixture.sh \
            scripts/prepare-polkavm-fixture.sh \
            scripts/prepare-solidity-fixture.sh \
            scripts/prepare-tolk-fixture.sh \
          ; do
            if [ -x "$script" ]; then
              echo "=== Running $script ==="
              nix develop -c bash "$script" || echo "WARNING: $script failed (non-fatal)"
            else
              echo "WARNING: $script not found or not executable"
            fi
          done

      - name: Run per-language smoke tests
        run: nix develop -c just test-wdio-smoke-langs

      - name: Run deep integration tests
        run: nix develop -c just test-wdio-deep

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-integration-diagnostics
          path: test/wdio/diagnostics/
          retention-days: 7
